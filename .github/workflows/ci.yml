name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.2
        with:
          install: true
          install_args: go golangci-lint buf
      - name: Vet and test
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: buf lint
        run: buf lint
      - name: Dependency licenses
        run: |
          go run github.com/google/go-licenses@v1.6.0 check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 \
            --ignore github.com/bvaliev/brokerium

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.2
        with:
          install: true
          install_args: node pnpm
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test, build
        working-directory: web
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Dependency licenses
        working-directory: web
        run: node scripts/check-licenses.mjs

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: brokerium-sbom.spdx.json

  images:
    name: images
    runs-on: ubuntu-latest
    needs: [go, web]
    if: github.event_name == 'push'
    env:
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      matrix:
        include:
          - image: brokerium-server
            dockerfile: deploy/docker/server.Dockerfile
          - image: brokerium-agent
            dockerfile: deploy/docker/agent.Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
      - uses: docker/setup-qemu-action@v4.4.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
      - uses: docker/setup-buildx-action@v4.4.1
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
      - uses: docker/login-action@v4.6.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7.4.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Skipped
        if: env.HAS_DOCKERHUB_TOKEN != 'true'
        run: echo "DOCKERHUB_TOKEN is not set; skipping image publishing."
