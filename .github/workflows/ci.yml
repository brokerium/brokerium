name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.0
        with:
          install: true
          install_args: go golangci-lint buf
      - name: Vet and test
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Vet and test the Enterprise edition
        run: |
          go vet -tags enterprise,licensetest ./...
          go test -count=1 -tags enterprise,licensetest ./...
      - name: Community server without Enterprise packages
        run: |
          if go list -deps ./cmd/brokerium-server | grep -E '^github.com/brokerium/brokerium/ee(/|$)'; then
            echo "The Community server depends on the Enterprise packages above." >&2
            exit 1
          fi
          go list -deps -tags enterprise ./cmd/brokerium-server | grep -qx github.com/brokerium/brokerium/ee
      - name: golangci-lint
        run: |
          golangci-lint run --build-tags e2e ./...
          golangci-lint run --build-tags enterprise,licensetest ./...
      - name: buf lint
        run: buf lint
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Dependency licenses
        run: |
          go run github.com/google/go-licenses@v1.6.0 check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 \
            --ignore github.com/brokerium/brokerium
      - name: Helm chart (helm is preinstalled on GitHub runners)
        run: |
          helm lint deploy/helm/brokerium
          helm template ci deploy/helm/brokerium > /dev/null
          helm template ci deploy/helm/brokerium --set postgresql.enabled=false --set database.url=postgres://u:p@db/b > /dev/null

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.0
        with:
          install: true
          install_args: node pnpm
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, build
        working-directory: web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          node scripts/check-edition.mjs community dist
      - name: Enterprise dashboard
        working-directory: web
        env:
          VITE_EDITION: enterprise
        run: |
          pnpm build
          node scripts/check-edition.mjs enterprise dist
      - name: Dependency licenses
        working-directory: web
        run: node scripts/check-licenses.mjs
      - name: OpenAPI
        run: npx --yes @redocly/cli@2.64.0 lint api/openapi.yaml

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: brokerium-sbom.spdx.json
          # The release workflow attaches the SBOM of a release.
          upload-release-assets: false

  images:
    name: images
    runs-on: ubuntu-latest
    needs: [go, web]
    if: github.event_name == 'push'
    env:
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      matrix:
        include:
          - image: brokerium-server
            dockerfile: deploy/docker/server.Dockerfile
            cache: brokerium-server
            tags: |
              type=raw,value=edge,enable={{is_default_branch}}
              type=sha,prefix=sha-
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
          - image: brokerium-server-enterprise
            dockerfile: deploy/docker/server.Dockerfile
            cache: brokerium-server-enterprise
            edition: enterprise
            labels: |
              org.opencontainers.image.title=brokerium-server-enterprise
              org.opencontainers.image.licenses=LicenseRef-PolyForm-Shield-1.0.0 AND LicenseRef-Brokerium-Commercial
            tags: |
              type=raw,value=edge,enable={{is_default_branch}}
              type=sha,prefix=sha-
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
          - image: brokerium-agent
            dockerfile: deploy/docker/agent.Dockerfile
            cache: brokerium-agent
            tags: |
              type=raw,value=edge,enable={{is_default_branch}}
              type=sha,prefix=sha-
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
          # Lab node image for the Docker provider; it must never take the latest tag of the agent.
          - image: brokerium-agent
            dockerfile: deploy/docker/agent-lab.Dockerfile
            cache: brokerium-agent-lab
            flavor: latest=false
            tags: |
              type=raw,value=lab,enable={{is_default_branch}}
              type=semver,pattern={{version}},suffix=-lab
    steps:
      - uses: actions/checkout@v7.0.1
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
      - uses: docker/setup-qemu-action@v4.4.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
      - uses: docker/setup-buildx-action@v4.4.1
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
      - uses: docker/login-action@v4.6.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          flavor: ${{ matrix.flavor }}
          tags: ${{ matrix.tags }}
          labels: ${{ matrix.labels }}
      - uses: docker/build-push-action@v7.4.0
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            ${{ matrix.edition && format('EDITION={0}', matrix.edition) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
      - name: Skipped
        if: env.HAS_DOCKERHUB_TOKEN != 'true'
        run: echo "DOCKERHUB_TOKEN is not set; skipping image publishing."
