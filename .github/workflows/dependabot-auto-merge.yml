name: dependabot auto-merge

# Minor and patch updates from Dependabot merge on their own once the required checks pass;
# major updates wait for a maintainer. The squashed commit keeps Dependabot's commit message
# rather than the long pull request description.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          body=$(gh pr view "$PR_URL" --json commits --jq '.commits[0].messageBody')
          gh pr merge --auto --squash --body "$body" "$PR_URL"
