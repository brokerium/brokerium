name: release

# Builds the release binaries of both editions and the Helm chart for a version tag and publishes them with checksums
# and an SBOM, pushes the chart to GHCR and updates the Helm repository on GitHub Pages.
# Container images for the tag are built by the CI workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.0
        with:
          install: true
          install_args: go node pnpm
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Dashboard
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build && node scripts/check-edition.mjs community dist && cd ..
          find internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
          cp -R web/dist/. internal/webui/dist/
      - name: Binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          flags="-s -w -X github.com/brokerium/brokerium/internal/version.Version=${VERSION} -X github.com/brokerium/brokerium/internal/version.Commit=${GITHUB_SHA::7} -X github.com/brokerium/brokerium/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "GO_LDFLAGS=$flags" >> "$GITHUB_ENV"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$flags" -o "dist/brokerium-server-${os}-${arch}" ./cmd/brokerium-server
          done
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$flags" -o "dist/brokerium-agent-linux-${arch}" ./cmd/brokerium-agent
          done
      - name: Enterprise dashboard
        run: |
          cd web && VITE_EDITION=enterprise pnpm build && node scripts/check-edition.mjs enterprise dist && cd ..
          find internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
          cp -R web/dist/. internal/webui/dist/
      - name: Enterprise binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/brokerium-server-enterprise-${os}-${arch}"
            GOOS=$os GOARCH=$arch go build -trimpath -tags enterprise -ldflags "$GO_LDFLAGS" -o "$out" ./cmd/brokerium-server
            if go version -m "$out" | grep -q licensetest; then
              echo "$out was built with the licensetest tag" >&2
              exit 1
            fi
          done
      - name: Chart
        env:
          VERSION: ${{ github.ref_name }}
        run: helm package deploy/helm/brokerium --version "${VERSION#v}" --app-version "${VERSION#v}" -d dist
      - name: Checksums
        run: cd dist && sha256sum brokerium-* > SHA256SUMS
      - uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/brokerium-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v v="## [${VERSION#v}]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${VERSION}" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --title "Brokerium $VERSION" --notes-file notes.md --verify-tag

  chart:
    name: chart
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Push the chart to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'brokerium-*.tgz'
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push brokerium-*.tgz oci://ghcr.io/brokerium/charts

  helm-repo:
    name: helm-repo
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/helm-repo.yml
