name: Feature request
description: Tell us what you need Brokerium to do
labels: ["type/feature", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation in your clusters, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Brokerium to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
  - type: dropdown
    id: environment
    attributes:
      label: Where do your clusters run?
      multiple: true
      options:
        - Virtual machines or bare metal
        - Kubernetes
        - Managed service (MSK, Confluent Cloud, Aiven)
