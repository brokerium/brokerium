version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - os.RemoveAll
        - fmt.Sscanf
  exclusions:
    paths:
      - proto/
formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - proto/
