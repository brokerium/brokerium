openapi: 3.1.0
info:
  title: Brokerium REST API
  version: v1
  summary: Control plane for Apache Kafka clusters.
  description: |
    REST API of `brokerium-server`, used by the embedded dashboard and by automation.

    **Authentication.** `POST /api/v1/auth/login` returns a session token and sets the
    `brokerium_session` cookie. Send the token either as the cookie or as
    `Authorization: Bearer <token>`.

    **CSRF.** Every request with a method other than GET or HEAD must carry the
    `X-Brokerium-Request: 1` header.

    **Roles.** `viewer` reads, `operator` changes clusters and runs operations, `admin` also
    manages users and deletes clusters. Each operation notes the minimum role.

    **Operations.** Every change to cluster topology is an operation: `POST
    /clusters/{id}/operations` returns a `planned` operation with a dry-run plan; nothing
    changes until `POST /operations/{op}/confirm`. Irreversible operations require
    `confirmName` equal to the cluster name.

    **Editions.** `GET /api/v1/license` names the edition of the server. Routes and operation
    types of Brokerium Enterprise answer 403 `license_required` without a license that covers
    their feature.

    **Errors** use `{"error": {"code": "...", "message": "..."}}`.

    Apache, Apache Kafka and Kafka are trademarks of the Apache Software Foundation.
    Brokerium is not affiliated with the ASF.
  license:
    name: PolyForm Shield 1.0.0
    identifier: LicenseRef-PolyForm-Shield-1.0.0
    url: https://polyformproject.org/licenses/shield/1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: system
  - name: auth
  - name: clusters
  - name: topics
  - name: groups
  - name: security
  - name: operations
  - name: nodes
  - name: users
  - name: audit
  - name: license

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema: { type: string, const: ok }
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe (database reachable)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            text/plain:
              schema: { type: string, const: ready }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/version:
    get:
      tags: [system]
      summary: Server version
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, date]
                properties:
                  version: { type: string }
                  commit: { type: string }
                  date: { type: string }
  /api/v1/server:
    get:
      tags: [system]
      summary: Build, edition and cluster providers of the server
      description: >-
        Role: viewer. `providers.docker` tells whether the server offers Docker clusters
        (`BROKERIUM_DOCKER_PROVIDER`). Without them, creating a Docker cluster and operations that
        change the nodes of one answer 409 `docker_unavailable` with the same reason.
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      security: []
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session created; the cookie is set as well.
          content:
            application/json:
              schema:
                type: object
                required: [user, token, expiresAt]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: >-
            Too many failed logins for this user from this address (`too_many_attempts`).
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out and delete the session
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Logged out. }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user
      description: "Role: viewer."
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/overview:
    get:
      tags: [clusters]
      summary: All clusters with health and capabilities
      description: "Role: viewer. Same payload as `GET /api/v1/clusters`."
      responses:
        "200": { $ref: "#/components/responses/ClusterList" }
  /api/v1/clusters:
    get:
      tags: [clusters]
      summary: List clusters
      description: "Role: viewer."
      responses:
        "200": { $ref: "#/components/responses/ClusterList" }
    post:
      tags: [clusters]
      summary: Register an existing cluster
      description: >-
        Role: operator. The connection is tested first unless `skipTest` is true. A Docker cluster
        (`provider: docker`) needs a server that offers Docker clusters (`GET /api/v1/server`),
        otherwise 409 `docker_unavailable`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterRequest" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/test:
    post:
      tags: [clusters]
      summary: Test a connection profile without saving it
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterRequest" }
      responses:
        "200":
          description: Test result (also for failed connections).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestResult" }
  /api/v1/clusters/{id}:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [clusters]
      summary: Cluster with its latest snapshot
      description: "Role: viewer. `fresh=1` collects a new snapshot before answering."
      parameters:
        - name: fresh
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Cluster view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [clusters]
      summary: Update a cluster profile
      description: >-
        Role: operator. Omitted fields keep their values; secrets are write-only. Changing the
        provider to `docker` needs a server that offers Docker clusters, otherwise 409
        `docker_unavailable`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [clusters]
      summary: Remove a cluster from Brokerium
      description: "Role: admin. Kafka itself is not touched."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed. }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/refresh:
    post:
      tags: [clusters]
      summary: Collect a new snapshot now
      description: "Role: viewer."
      parameters:
        - { $ref: "#/components/parameters/ClusterId" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200":
          description: Fresh cluster view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
  /api/v1/clusters/{id}/rates:
    get:
      tags: [clusters]
      summary: Agentless throughput estimates per broker and topic
      description: "Role: viewer. Derived from offset and log size deltas (ADR 0010)."
      parameters: [{ $ref: "#/components/parameters/ClusterId" }]
      responses:
        "200":
          description: Rates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rates" }
  /api/v1/clusters/{id}/brokers/{broker}/configs:
    parameters:
      - { $ref: "#/components/parameters/ClusterId" }
      - name: broker
        in: path
        required: true
        schema: { type: integer, format: int32 }
    get:
      tags: [clusters]
      summary: Broker configuration
      description: "Role: viewer."
      responses:
        "200":
          description: Config entries; sensitive values are masked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigEntry" }
    patch:
      tags: [clusters]
      summary: Change dynamic broker configs
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigChange" }
      responses:
        "204": { description: Applied. }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/clusters/{id}/topics:
    post:
      tags: [topics]
      summary: Create a topic
      description: "Role: operator. Partitions and replication factor default to the broker defaults when 0."
      parameters:
        - { $ref: "#/components/parameters/ClusterId" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                partitions: { type: integer, format: int32 }
                replicationFactor: { type: integer, format: int16 }
                configs:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic: { type: string }
                  id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/topics/{topic}:
    parameters:
      - { $ref: "#/components/parameters/ClusterId" }
      - { $ref: "#/components/parameters/Topic" }
    get:
      tags: [topics]
      summary: Topic with configs and partition offsets
      description: "Role: viewer."
      responses:
        "200":
          description: Topic detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicDetail" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [topics]
      summary: Delete a topic
      description: "Role: operator. `confirm` must repeat the topic name."
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - name: confirm
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/topics/{topic}/configs:
    patch:
      tags: [topics]
      summary: Change topic configs
      description: "Role: operator."
      parameters:
        - { $ref: "#/components/parameters/ClusterId" }
        - { $ref: "#/components/parameters/Topic" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigChange" }
      responses:
        "204": { description: Applied. }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/topics/{topic}/partitions:
    post:
      tags: [topics]
      summary: Increase the partition count
      description: "Role: operator. `count` is the new total."
      parameters:
        - { $ref: "#/components/parameters/ClusterId" }
        - { $ref: "#/components/parameters/Topic" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer }
      responses:
        "204": { description: Applied. }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/topics/{topic}/delete-records:
    parameters:
      - { $ref: "#/components/parameters/ClusterId" }
      - { $ref: "#/components/parameters/Topic" }
    post:
      tags: [topics]
      summary: Delete records or empty a topic
      description: >-
        Brokerium Enterprise, feature `message-tools`. Role: operator. Deletes the records before
        an offset in each listed partition, the records older than a time, or all records (Kafka
        DeleteRecords). Offsets past the end are clamped to the end. A dry run shows what would be
        deleted; otherwise `confirm` must repeat the topic name. Topics whose `cleanup.policy`
        does not include `delete` answer 409 `compacted_topic`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `partitions`, `beforeTimestamp` and `all`.
              properties:
                partitions:
                  type: array
                  items:
                    type: object
                    required: [partition, offset]
                    properties:
                      partition: { type: integer, format: int32 }
                      offset: { type: integer, format: int64, description: The records before this offset are deleted. }
                beforeTimestamp: { type: integer, format: int64, description: Unix milliseconds. }
                all: { type: boolean }
                dryRun: { type: boolean }
                confirm: { type: string, description: The topic name; required unless `dryRun` is set. }
      responses:
        "200":
          description: Planned or performed deletion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteRecordsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/topics/{topic}/search:
    parameters:
      - { $ref: "#/components/parameters/ClusterId" }
      - { $ref: "#/components/parameters/Topic" }
    post:
      tags: [topics]
      summary: Search records
      description: >-
        Brokerium Enterprise, feature `message-tools`. Role: viewer. Reads the selected partitions
        from the start of the time range (or the earliest record) and returns the records that
        match, sorted by partition and offset. The search stops after `limit` matches (100 by
        default, at most 1000), `maxRecords` records read (a million by default) or
        `timeoutSeconds` (30 by default, at most 300); pass `next` as `resume` to continue.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/MessageSelection" }
                - type: object
                  properties:
                    limit: { type: integer }
                    maxRecords: { type: integer, format: int64 }
                    timeoutSeconds: { type: integer }
      responses:
        "200":
          description: Matches and how far the search got.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ScanResult" }
                  - type: object
                    properties:
                      messages:
                        type: array
                        items: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/topics/{topic}/export:
    parameters:
      - { $ref: "#/components/parameters/ClusterId" }
      - { $ref: "#/components/parameters/Topic" }
    post:
      tags: [topics]
      summary: Export records
      description: >-
        Brokerium Enterprise, feature `message-tools`. Role: viewer. Streams the matching records
        as a file with complete values: NDJSON (the default), a JSON array or CSV. Keys, values and
        header values that are not UTF-8 are base64-encoded. At most `limit` records (a million)
        within `timeoutSeconds` (600 by default, at most 3600). Exports are audited as
        `topic.export`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/MessageSelection" }
                - type: object
                  properties:
                    format: { type: string, enum: [ndjson, json, csv], default: ndjson }
                    limit: { type: integer, format: int64 }
                    timeoutSeconds: { type: integer }
      responses:
        "200":
          description: The file.
          content:
            application/x-ndjson: { schema: { type: string } }
            application/json: { schema: { type: string } }
            text/csv: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/topics/{topic}/messages:
    parameters:
      - { $ref: "#/components/parameters/ClusterId" }
      - { $ref: "#/components/parameters/Topic" }
    get:
      tags: [topics]
      summary: Browse messages
      description: >-
        Role: viewer. Keys, values and header values that are not UTF-8 are returned
        base64-encoded. The limit is split evenly between the partitions read. Pass `next` or
        `previous` of a response as `cursor` with `from=after` or `from=before` to read the
        following or the preceding page of every partition.
      parameters:
        - name: partition
          in: query
          description: One partition; all partitions by default. Ignored with a cursor.
          schema: { type: integer, format: int32 }
        - name: from
          in: query
          schema: { type: string, enum: [latest, earliest, offset, timestamp, after, before], default: latest }
        - name: cursor
          in: query
          description: Offsets per partition (`0:120,1:98`) for `from=after` and `from=before`.
          schema: { type: string }
        - name: offset
          in: query
          description: Start offset when `from=offset`.
          schema: { type: integer, format: int64 }
        - name: timestamp
          in: query
          description: Start time in Unix milliseconds when `from=timestamp`.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next:
                    type: [string, "null"]
                    description: Cursor of the following page; null when every partition was read to its end.
                  previous:
                    type: [string, "null"]
                    description: Cursor of the preceding page; null at the start of every partition.
    post:
      tags: [topics]
      summary: Produce one message
      description: "Role: operator. A null value produces a tombstone."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                partition: { type: [integer, "null"], format: int32 }
                key: { type: [string, "null"] }
                keyEncoding: { type: string, enum: [utf8, base64], default: utf8 }
                value: { type: [string, "null"] }
                valueEncoding: { type: string, enum: [utf8, base64], default: utf8 }
                headers:
                  type: array
                  items: { $ref: "#/components/schemas/MessageHeader" }
      responses:
        "201":
          description: Produced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partition: { type: integer, format: int32 }
                  offset: { type: integer, format: int64 }

  /api/v1/clusters/{id}/groups/{group}:
    parameters:
      - { $ref: "#/components/parameters/ClusterId" }
      - { $ref: "#/components/parameters/Group" }
    get:
      tags: [groups]
      summary: Consumer group with per-partition lag
      description: "Role: viewer."
      responses:
        "200":
          description: Group detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
    delete:
      tags: [groups]
      summary: Delete an empty consumer group
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/groups/{group}/reset-offsets:
    post:
      tags: [groups]
      summary: Reset committed offsets of an inactive group
      description: "Role: operator. Use `dryRun` to preview the new offsets."
      parameters:
        - { $ref: "#/components/parameters/ClusterId" }
        - { $ref: "#/components/parameters/Group" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, to]
              properties:
                topic: { type: string }
                partitions:
                  type: array
                  items: { type: integer, format: int32 }
                to: { type: string, enum: [earliest, latest, timestamp, offset] }
                timestamp: { type: integer, format: int64, description: Unix milliseconds. }
                offset: { type: integer, format: int64 }
                dryRun: { type: boolean }
      responses:
        "200":
          description: Old and new offsets per partition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun: { type: boolean }
                  offsets:
                    type: array
                    items:
                      type: object
                      properties:
                        topic: { type: string }
                        partition: { type: integer, format: int32 }
                        from: { type: integer, format: int64 }
                        to: { type: integer, format: int64 }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/clusters/{id}/acls:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [security]
      summary: List ACLs
      description: "Role: viewer."
      responses:
        "200":
          description: ACL bindings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  acls:
                    type: array
                    items: { $ref: "#/components/schemas/Acl" }
    post:
      tags: [security]
      summary: Create an ACL binding
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Acl" }
      responses:
        "201": { description: Created. }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [security]
      summary: Delete ACL bindings matching the body exactly
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Acl" }
      responses:
        "204": { description: Deleted. }
  /api/v1/clusters/{id}/scram-users:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [security]
      summary: List SCRAM credentials
      description: "Role: viewer."
      responses:
        "200":
          description: Users and their mechanisms (never passwords).
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/ScramUser" }
    post:
      tags: [security]
      summary: Create or update a SCRAM credential
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, mechanism, password]
              properties:
                user: { type: string }
                mechanism: { type: string, enum: [SCRAM-SHA-256, SCRAM-SHA-512] }
                password: { type: string, format: password }
                iterations: { type: integer, format: int32, minimum: 4096 }
      responses:
        "201": { description: Saved. }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/clusters/{id}/scram-users/{user}:
    delete:
      tags: [security]
      summary: Delete a SCRAM credential
      description: "Role: operator."
      parameters:
        - { $ref: "#/components/parameters/ClusterId" }
        - { $ref: "#/components/parameters/CSRF" }
        - name: user
          in: path
          required: true
          schema: { type: string }
        - name: mechanism
          in: query
          required: true
          schema: { type: string, enum: [SCRAM-SHA-256, SCRAM-SHA-512] }
      responses:
        "204": { description: Deleted. }
  /api/v1/clusters/{id}/quotas:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [security]
      summary: List client quotas
      description: "Role: viewer."
      responses:
        "200":
          description: Quota entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotas:
                    type: array
                    items: { $ref: "#/components/schemas/QuotaEntry" }
    put:
      tags: [security]
      summary: Set or remove quota values for an entity
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity]
              properties:
                entity:
                  type: array
                  items: { $ref: "#/components/schemas/QuotaEntity" }
                set:
                  type: object
                  additionalProperties: { type: number }
                remove:
                  type: array
                  items: { type: string }
      responses:
        "204": { description: Applied. }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/operation-types:
    get:
      tags: [operations]
      summary: Operation types the server can plan
      description: "Role: viewer."
      responses:
        "200":
          description: Types with required capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items: { $ref: "#/components/schemas/OperationType" }
  /api/v1/clusters/{id}/operations:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [operations]
      summary: Operations of one cluster
      description: "Role: viewer."
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/OperationList" }
    post:
      tags: [operations]
      summary: Plan an operation (dry run)
      description: |
        Role: operator. Returns a `planned` operation with its plan and steps. Nothing changes
        in the cluster until the operation is confirmed. Plans expire after 15 minutes.
        Operations that change the nodes of a Docker cluster answer 409 `docker_unavailable`
        while the server does not offer Docker clusters (`GET /api/v1/server`).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, examples: [rebalance] }
                params:
                  type: object
                  description: Parameters of the operation type, see `OperationParams`.
      responses:
        "201":
          description: Planned operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations:
    get:
      tags: [operations]
      summary: Operations of all clusters
      description: "Role: viewer."
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/OperationList" }
  /api/v1/operations/{op}:
    parameters: [{ $ref: "#/components/parameters/OperationId" }]
    get:
      tags: [operations]
      summary: Operation with its steps
      description: "Role: viewer."
      responses:
        "200":
          description: Operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [operations]
      summary: Discard a planned operation
      description: "Role: operator."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Discarded. }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{op}/confirm:
    post:
      tags: [operations]
      summary: Confirm and start a planned operation
      description: >-
        Role: operator. Irreversible operations need `confirmName` equal to the cluster name.
        Operations that change the nodes of a Docker cluster answer 409 `docker_unavailable` while
        the server does not offer Docker clusters.
      parameters:
        - { $ref: "#/components/parameters/OperationId" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmName: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{op}/pause:
    post:
      tags: [operations]
      summary: Pause after the current step
      description: "Role: operator."
      parameters:
        - { $ref: "#/components/parameters/OperationId" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{op}/resume:
    post:
      tags: [operations]
      summary: Resume a paused or failed operation
      description: >-
        Role: operator. Operations that change the nodes of a Docker cluster answer 409
        `docker_unavailable` while the server does not offer Docker clusters.
      parameters:
        - { $ref: "#/components/parameters/OperationId" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{op}/cancel:
    post:
      tags: [operations]
      summary: Cancel; cleanup steps such as throttle removal still run
      description: "Role: operator."
      parameters:
        - { $ref: "#/components/parameters/OperationId" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/nodes:
    get:
      tags: [nodes]
      summary: Agent nodes
      description: "Role: viewer."
      parameters:
        - name: clusterId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Nodes with connection state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/AgentNode" }
  /api/v1/nodes/{id}:
    delete:
      tags: [nodes]
      summary: Forget a node
      description: "Role: operator. Refused while the node is connected and assigned to a cluster."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Deleted. }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/join-tokens:
    post:
      tags: [nodes]
      summary: Create a one-time join token for an agent
      description: "Role: operator. Returns the install command for the host."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeName]
              properties:
                nodeName: { type: string, pattern: "^[a-z0-9][a-z0-9.-]*$" }
                clusterId: { type: [string, "null"] }
                ttlMinutes: { type: integer, minimum: 1, maximum: 10080, default: 60 }
      responses:
        "201":
          description: Token and install command.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, command]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  command: { type: string }
  /api/v1/agent/install.sh:
    get:
      tags: [nodes]
      summary: Agent install script
      security: []
      responses:
        "200":
          description: POSIX shell script that downloads and starts brokerium-agent as a systemd service.
          content:
            text/x-shellscript:
              schema: { type: string }

  /api/v1/users:
    get:
      tags: [users]
      summary: List users
      description: "Role: admin."
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
    post:
      tags: [users]
      summary: Create a user
      description: "Role: admin."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [users]
      summary: Change role, password or disabled flag
      description: "Role: admin."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
    delete:
      tags: [users]
      summary: Delete a user
      description: "Role: admin. The last admin cannot be deleted."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/audit:
    get:
      tags: [audit]
      summary: Audit log, newest first
      description: "Role: viewer."
      parameters:
        - name: clusterId
          in: query
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }

  /api/v1/license:
    get:
      tags: [license]
      summary: Edition, Enterprise features and license
      description: >-
        Role: viewer. Lists the features of Brokerium Enterprise and whether the license covers
        them. `license` is null in Community builds and in Enterprise builds without a key.
      responses:
        "200":
          description: The edition and the license.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseView" }
    put:
      tags: [license]
      summary: Add or replace the license key
      description: >-
        Role: admin. Enterprise builds only. Verifies the key offline and stores it in the
        database; keys that expired or are not valid yet are refused. Audited as `license.update`
        without the key text.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseRequest" }
      responses:
        "200":
          description: The key is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseView" }
        "400":
          description: The key does not verify, expired or is not valid yet (`invalid_license`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/LicenseConflict" }
    delete:
      tags: [license]
      summary: Remove the stored license key
      description: >-
        Role: admin. Enterprise builds only. Enterprise features are locked afterwards. Audited
        as `license.delete`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed. }
        "409": { $ref: "#/components/responses/LicenseConflict" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: brokerium_session
    bearerToken:
      type: http
      scheme: bearer
      description: The session token returned by `POST /api/v1/auth/login`.

  parameters:
    CSRF:
      name: X-Brokerium-Request
      in: header
      required: true
      description: Required on every non-GET request.
      schema: { type: string, const: "1" }
    ClusterId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Topic:
      name: topic
      in: path
      required: true
      schema: { type: string }
    Group:
      name: group
      in: path
      required: true
      schema: { type: string }
    OperationId:
      name: op
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000 }

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ClusterList:
      description: Clusters with health and capabilities.
      content:
        application/json:
          schema:
            type: object
            properties:
              clusters:
                type: array
                items: { $ref: "#/components/schemas/ClusterSummary" }
    OperationList:
      description: Operations, newest first.
      content:
        application/json:
          schema:
            type: object
            properties:
              operations:
                type: array
                items: { $ref: "#/components/schemas/Operation" }
    OperationResult:
      description: The operation after the action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Operation" }
    LicenseConflict:
      description: >-
        The server runs the Community edition (`edition_required`), or the key comes from
        `BROKERIUM_LICENSE` or `BROKERIUM_LICENSE_FILE` and can only be changed there
        (`license_managed_externally`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      required: [id, username, role, disabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }

    Provider:
      type: string
      enum: [external, agent, docker, strimzi]
    Flavor:
      type: string
      enum: [apache, msk, confluent-cloud, aiven]
    Security:
      type: object
      required: [protocol]
      properties:
        protocol: { type: string, enum: [PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL] }
        saslMechanism:
          type: string
          enum: ["", PLAIN, SCRAM-SHA-256, SCRAM-SHA-512, AWS_MSK_IAM, OAUTHBEARER]
        username: { type: string }
        tlsServerName: { type: string }
        tlsInsecureSkipVerify: { type: boolean }
        tlsCaCertPem: { type: string }
        awsRegion: { type: string }
    Secrets:
      type: object
      description: Write-only; stored encrypted and never returned.
      writeOnly: true
      properties:
        password: { type: string, format: password }
        tlsClientCertPem: { type: string }
        tlsClientKeyPem: { type: string }
        awsAccessKeyId: { type: string }
        awsSecretAccessKey: { type: string }
        awsSessionToken: { type: string }
        oauthToken: { type: string }
    Cluster:
      type: object
      required: [id, name, provider, flavor, bootstrapServers, security, kafkaClusterId, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        flavor: { $ref: "#/components/schemas/Flavor" }
        bootstrapServers:
          type: array
          items: { type: string }
        security: { $ref: "#/components/schemas/Security" }
        labels:
          type: object
          additionalProperties: { type: string }
        settings:
          type: object
          description: Provider settings, for example Kafka version and port base of Docker clusters.
        kafkaClusterId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClusterRequest:
      type: object
      properties:
        name: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        flavor: { $ref: "#/components/schemas/Flavor" }
        bootstrapServers:
          type: array
          items: { type: string }
        security: { $ref: "#/components/schemas/Security" }
        secrets: { $ref: "#/components/schemas/Secrets" }
        labels:
          type: object
          additionalProperties: { type: string }
        settings: { type: object }
        skipTest: { type: boolean }
    TestResult:
      type: object
      required: [ok, brokers]
      properties:
        ok: { type: boolean }
        clusterId: { type: string }
        brokers: { type: integer }
        error: { type: string }

    Issue:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [critical, warning, info] }
        code: { type: string }
        message: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, warning, critical, unreachable, unknown] }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        brokers: { type: integer }
        brokersAlive: { type: integer }
        brokersFenced: { type: integer }
        brokersCordoned: { type: integer }
        topics: { type: integer }
        partitions: { type: integer }
        offlinePartitions: { type: integer }
        underReplicated: { type: integer }
        underMinIsr: { type: integer }
        atMinIsr: { type: integer }
        reassigning: { type: integer }
        quorumLeader: { type: integer }
        voters: { type: integer }
        votersLagging: { type: integer }
        diskUsedPercentMax: { type: number }
        metadataVersion: { type: string }
        kraftVersion: { type: integer }
    Capabilities:
      type: object
      description: Actions available for this cluster; the dashboard shows only these.
      properties:
        manageTopics: { type: boolean }
        manageConfigs: { type: boolean }
        manageAcls: { type: boolean }
        manageScram: { type: boolean }
        manageQuotas: { type: boolean }
        manageGroups: { type: boolean }
        browseMessages: { type: boolean }
        reassign: { type: boolean }
        electLeaders: { type: boolean }
        cordon: { type: boolean }
        unregisterBrokers: { type: boolean }
        describeQuorum: { type: boolean }
        removeVoters: { type: boolean }
        addControllers: { type: boolean }
        provisionNodes: { type: boolean }
        restartNodes: { type: boolean }
        upgradeVersion: { type: boolean }
        finalizeFeatures: { type: boolean }
        migrateQuorum: { type: boolean }
        scaleNodePools: { type: boolean }
        notes:
          type: array
          items: { type: string }
    ClusterSummary:
      type: object
      required: [cluster, health, capabilities, updatedAt]
      properties:
        cluster: { $ref: "#/components/schemas/Cluster" }
        health: { $ref: "#/components/schemas/Health" }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        error: { type: string }
        updatedAt: { type: string, format: date-time }
    ClusterView:
      allOf:
        - $ref: "#/components/schemas/ClusterSummary"
        - type: object
          properties:
            snapshot: { $ref: "#/components/schemas/Snapshot" }

    Endpoint:
      type: object
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer }
    QuorumReplica:
      type: object
      properties:
        nodeId: { type: integer }
        directoryId: { type: string }
        role: { type: string, enum: [leader, follower, observer] }
        logEndOffset: { type: integer, format: int64 }
        lag: { type: integer, format: int64 }
        lastFetchTimestamp: { type: integer, format: int64 }
        lastCaughtUpTimestamp: { type: integer, format: int64 }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
    Quorum:
      type: object
      properties:
        leaderId: { type: integer }
        leaderEpoch: { type: integer }
        highWatermark: { type: integer, format: int64 }
        voters:
          type: array
          items: { $ref: "#/components/schemas/QuorumReplica" }
        observers:
          type: array
          items: { $ref: "#/components/schemas/QuorumReplica" }
    LogDir:
      type: object
      properties:
        path: { type: string }
        totalBytes: { type: integer, format: int64 }
        usableBytes: { type: integer, format: int64 }
        dataBytes: { type: integer, format: int64 }
        cordoned: { type: boolean }
        error: { type: string }
    Broker:
      type: object
      properties:
        id: { type: integer, format: int32 }
        host: { type: string }
        port: { type: integer }
        rack: { type: string }
        fenced: { type: boolean }
        alive: { type: boolean }
        cordoned: { type: boolean }
        logDirs:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/LogDir" }
        diskTotalBytes: { type: integer, format: int64 }
        diskUsableBytes: { type: integer, format: int64 }
        dataBytes: { type: integer, format: int64 }
        replicas: { type: integer }
        leaders: { type: integer }
        preferredLeaders: { type: integer }
    Partition:
      type: object
      properties:
        id: { type: integer, format: int32 }
        leader: { type: integer, format: int32 }
        leaderEpoch: { type: integer, format: int32 }
        replicas:
          type: array
          items: { type: integer, format: int32 }
        isr:
          type: array
          items: { type: integer, format: int32 }
        offline:
          type: [array, "null"]
          items: { type: integer, format: int32 }
        sizeBytes: { type: integer, format: int64 }
        replicaBytes:
          type: [object, "null"]
          additionalProperties: { type: integer, format: int64 }
        error: { type: string }
    Topic:
      type: object
      properties:
        name: { type: string }
        id: { type: string }
        internal: { type: boolean }
        replicationFactor: { type: integer }
        minInsyncReplicas: { type: integer }
        configs:
          type: object
          additionalProperties: { type: string }
        sizeBytes: { type: integer, format: int64 }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/Partition" }
        error: { type: string }
    Reassignment:
      type: object
      properties:
        topic: { type: string }
        partition: { type: integer, format: int32 }
        replicas:
          type: array
          items: { type: integer, format: int32 }
        adding:
          type: [array, "null"]
          items: { type: integer, format: int32 }
        removing:
          type: [array, "null"]
          items: { type: integer, format: int32 }
    Group:
      type: object
      properties:
        id: { type: string }
        type: { type: string, description: "consumer, classic, share or streams" }
        state: { type: string }
        protocolType: { type: string }
        members: { type: integer }
        lag: { type: integer, format: int64 }
        topics:
          type: [array, "null"]
          items: { type: string }
        error: { type: string }
    Feature:
      type: object
      properties:
        name: { type: string }
        finalized: { type: integer }
        supportedMin: { type: integer }
        supportedMax: { type: integer }
    Snapshot:
      type: object
      properties:
        collectedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        clusterId: { type: string }
        brokers:
          type: array
          items: { $ref: "#/components/schemas/Broker" }
        quorum: { $ref: "#/components/schemas/Quorum" }
        features:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }
        reassignments:
          type: array
          items: { $ref: "#/components/schemas/Reassignment" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        errors:
          type: array
          items: { type: string }
    ConfigEntry:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        source: { type: string }
        sensitive: { type: boolean }
    ConfigChange:
      type: object
      properties:
        set:
          type: object
          additionalProperties: { type: string }
        delete:
          type: array
          items: { type: string }
    TopicDetail:
      type: object
      properties:
        topic: { $ref: "#/components/schemas/Topic" }
        configs:
          type: array
          items: { $ref: "#/components/schemas/ConfigEntry" }
        offsets:
          type: object
          description: Start and end offsets keyed by partition id.
          additionalProperties:
            type: object
            properties:
              start: { type: integer, format: int64 }
              end: { type: integer, format: int64 }
    GroupDetail:
      type: object
      properties:
        group: { type: string }
        state: { type: string }
        protocolType: { type: string }
        members: { type: integer }
        totalLag: { type: integer, format: int64 }
        error: { type: string }
        partitions:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              partition: { type: integer, format: int32 }
              committed: { type: integer, format: int64 }
              end: { type: integer, format: int64 }
              lag: { type: integer, format: int64 }
              member: { type: string }
              clientId: { type: string }
              host: { type: string }
    Rates:
      type: object
      properties:
        sampledAt: { type: string, format: date-time }
        windowSeconds: { type: number }
        brokers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RateEntry" }
        topics:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RateEntry" }
    RateEntry:
      type: object
      properties:
        bytesInPerSec: { type: number }
        messagesInPerSec: { type: number }

    MessageMatch:
      type: object
      description: Either a text the bytes contain or a regular expression (RE2 syntax), at most 1024 bytes.
      properties:
        contains: { type: string }
        regex: { type: string }
    MessageSelection:
      type: object
      description: Partitions, a time range and a filter; empty fields match every record.
      properties:
        partitions: { type: array, items: { type: integer, format: int32 }, description: All partitions when empty. }
        fromTime: { type: integer, format: int64, description: "Unix milliseconds, inclusive." }
        toTime: { type: integer, format: int64, description: "Unix milliseconds, exclusive." }
        resume:
          type: array
          description: Continues an earlier search from the offsets in its `next`.
          items:
            type: object
            properties:
              partition: { type: integer, format: int32 }
              offset: { type: integer, format: int64 }
        key: { $ref: "#/components/schemas/MessageMatch" }
        value: { $ref: "#/components/schemas/MessageMatch" }
        header:
          type: object
          required: [key]
          properties:
            key: { type: string }
            value: { $ref: "#/components/schemas/MessageMatch" }
        ignoreCase: { type: boolean }
    ScanResult:
      type: object
      properties:
        scanned: { type: integer, format: int64, description: Records read. }
        next:
          type: array
          description: The first offset not read in each partition.
          items:
            type: object
            properties:
              partition: { type: integer, format: int32 }
              offset: { type: integer, format: int64 }
        complete: { type: boolean, description: Every partition was read to the end of the range. }
        stopped: { type: string, enum: [limit, records, time], description: What ended an incomplete search. }
    DeleteRecordsResult:
      type: object
      properties:
        partitions:
          type: array
          description: Partitions with records to delete.
          items:
            type: object
            properties:
              partition: { type: integer, format: int32 }
              startOffset: { type: integer, format: int64 }
              endOffset: { type: integer, format: int64 }
              deleteBefore: { type: integer, format: int64, description: The new start offset. }
              records: { type: integer, format: int64 }
              error: { type: string, description: Why the deletion failed in this partition. }
        records: { type: integer, format: int64 }
        failed: { type: integer, description: Partitions where the deletion failed. }
        dryRun: { type: boolean }
    MessageHeader:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
        encoding:
          type: string
          enum: [utf8, base64]
          description: Omitted for text.
    Message:
      type: object
      properties:
        partition: { type: integer, format: int32 }
        offset: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        key: { type: [string, "null"] }
        value: { type: [string, "null"] }
        headers:
          type: array
          items: { $ref: "#/components/schemas/MessageHeader" }
        keyEncoding: { type: string, enum: [utf8, base64] }
        valueEncoding: { type: string, enum: [utf8, base64] }
    Acl:
      type: object
      required: [resourceType, resourceName, patternType, principal, host, operation, permission]
      properties:
        resourceType: { type: string, enum: [TOPIC, GROUP, CLUSTER, TRANSACTIONAL_ID, DELEGATION_TOKEN, USER] }
        resourceName: { type: string }
        patternType: { type: string, enum: [LITERAL, PREFIXED] }
        principal: { type: string, examples: ["User:alice"] }
        host: { type: string, examples: ["*"] }
        operation: { type: string, examples: [READ, WRITE, DESCRIBE, ALL] }
        permission: { type: string, enum: [ALLOW, DENY] }
    ScramUser:
      type: object
      properties:
        user: { type: string }
        mechanisms:
          type: array
          items:
            type: object
            properties:
              mechanism: { type: string, enum: [SCRAM-SHA-256, SCRAM-SHA-512] }
              iterations: { type: integer, format: int32 }
    QuotaEntity:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [user, client-id, ip] }
        name:
          type: [string, "null"]
          description: null selects the default entity.
    QuotaEntry:
      type: object
      properties:
        entity:
          type: array
          items: { $ref: "#/components/schemas/QuotaEntity" }
        values:
          type: object
          additionalProperties: { type: number }

    OperationType:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        description: { type: string }
        scope: { type: string, enum: [cluster, broker, controller, node] }
        requires:
          type: array
          description: Capabilities that must all be true.
          items: { type: string }
        irreversible: { type: boolean }
        feature:
          type: string
          description: >-
            Enterprise feature that the license must cover to plan and confirm the operation;
            missing for Community operations. Without it the API answers 403 `license_required`.
    OperationParams:
      description: Parameters of each operation type, keyed by type name.
      type: object
      properties:
        rebalance:
          type: object
          properties:
            mode: { type: string, enum: [even, replicas, leaders] }
            excludeBrokers: { type: array, items: { type: integer } }
            topics: { type: array, items: { type: string } }
            maxMoves: { type: integer }
            throttleBytesPerSec: { type: integer, format: int64 }
            batchSize: { type: integer }
            rackAware: { type: boolean }
        move-partitions:
          type: object
          required: [moves]
          properties:
            moves:
              type: array
              items:
                type: object
                required: [topic, partition, replicas]
                properties:
                  topic: { type: string }
                  partition: { type: integer }
                  replicas: { type: array, items: { type: integer } }
            throttleBytesPerSec: { type: integer, format: int64 }
            batchSize: { type: integer }
        elect-leaders:
          type: object
          properties:
            topics: { type: array, items: { type: string } }
        cordon-broker:
          type: object
          required: [brokerId, cordon]
          properties:
            brokerId: { type: integer }
            cordon: { type: boolean }
        drain-broker:
          type: object
          required: [brokerId]
          properties:
            brokerId: { type: integer }
            decommission: { type: boolean }
            throttleBytesPerSec: { type: integer, format: int64 }
        unregister-broker:
          type: object
          required: [brokerId]
          properties:
            brokerId: { type: integer }
        remove-controller:
          type: object
          required: [nodeId]
          properties:
            nodeId: { type: integer }
        finalize-upgrade:
          type: object
          description: Raises every feature to the highest level all nodes support.
        copy-messages:
          description: >-
            Brokerium Enterprise, feature `message-tools`. Copies the selected records that exist at
            planning time to a topic of this or another cluster, one step per partition, with a
            throttle. A restart of the server during a step copies the records since its last
            progress again.
          allOf:
            - { $ref: "#/components/schemas/MessageSelection" }
            - type: object
              required: [topic, targetTopic]
              properties:
                topic: { type: string, description: The source topic. }
                targetCluster: { type: string, description: The cluster of the operation by default. }
                targetTopic: { type: string, description: Must exist. }
                partitioning:
                  type: string
                  enum: [same, key]
                  description: "`same` keeps partition numbers, `key` uses the partitioner of the target; `same` by default when the target has enough partitions."
                keepTimestamps: { type: boolean, default: true }
                throttleBytesPerSec: { type: integer, format: int64, default: 10485760 }
        bootstrap-cluster:
          type: object
          properties:
            controllers: { type: integer, minimum: 1, maximum: 5 }
            brokers: { type: integer, minimum: 1 }
            version: { type: string }
            racks: { type: array, items: { type: string } }
            quorum: { type: string, enum: [dynamic, static] }
            portBase: { type: integer }
        add-broker:
          type: object
          properties:
            count: { type: integer, minimum: 1 }
            rack: { type: string }
            rebalance: { type: boolean }
        replace-broker:
          type: object
          required: [brokerId]
          properties:
            brokerId: { type: integer }
            mode: { type: string, enum: [new-id, same-id] }
        add-controller:
          type: object
        migrate-quorum:
          type: object
        rolling-restart:
          type: object
          properties:
            nodeIds: { type: array, items: { type: integer } }
        rolling-upgrade:
          type: object
          required: [version]
          properties:
            version: { type: string, examples: ["4.4.0"] }
    Step:
      type: object
      properties:
        index: { type: integer }
        name: { type: string }
        kind: { type: string }
        args: {}
        alwaysRun: { type: boolean }
        status: { type: string, enum: [pending, running, succeeded, failed, skipped] }
        detail: {}
        error: { type: string }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    PartitionMove:
      type: object
      properties:
        topic: { type: string }
        partition: { type: integer }
        from: { type: array, items: { type: integer } }
        to: { type: array, items: { type: integer } }
        sizeBytes: { type: integer, format: int64 }
        replicaMoves: { type: integer }
        leaderChange: { type: boolean }
    BrokerLoad:
      type: object
      properties:
        id: { type: integer }
        rack: { type: string }
        replicas: { type: integer }
        leaders: { type: integer }
        dataBytes: { type: integer, format: int64 }
        bytesInPerSec: { type: number }
        excluded: { type: boolean }
    DistributionStats:
      type: object
      properties:
        brokers: { type: array, items: { $ref: "#/components/schemas/BrokerLoad" } }
        replicaSpread: { type: integer }
        leaderSpread: { type: integer }
        dataSpreadBytes: { type: integer, format: int64 }
        score: { type: number }
    OperationPlan:
      type: object
      properties:
        summary: { type: string }
        warnings: { type: array, items: { type: string } }
        irreversible: { type: boolean }
        moves: { type: array, items: { $ref: "#/components/schemas/PartitionMove" } }
        before: { $ref: "#/components/schemas/DistributionStats" }
        after: { $ref: "#/components/schemas/DistributionStats" }
        dataToMoveBytes: { type: integer, format: int64 }
        details: { type: object }
    Operation:
      type: object
      properties:
        id: { type: string }
        clusterId: { type: string }
        type: { type: string }
        status: { type: string, enum: [planned, pending, running, paused, succeeded, failed, cancelled] }
        summary: { type: string }
        params: { type: object }
        plan: { $ref: "#/components/schemas/OperationPlan" }
        irreversible: { type: boolean }
        currentStep: { type: integer }
        requestedAction: { type: string }
        error: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }

    AgentNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        clusterId: { type: [string, "null"] }
        role: { type: string, enum: ["", broker, controller] }
        kafkaNodeId: { type: [integer, "null"] }
        hostname: { type: string }
        agentVersion: { type: string }
        transport:
          type: string
          enum: [mtls, insecure]
          description: >-
            Transport of the last enrollment: mtls (client certificate) or insecure (signed
            messages for agents behind a TLS-terminating proxy, no certificate).
        status:
          type: object
          description: Last status reported by the agent.
        labels:
          type: [object, "null"]
          additionalProperties: { type: string }
        providerRef: { type: string }
        lastSeenAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        connected: { type: boolean }
        certNotAfter:
          type: [string, "null"]
          format: date-time
          description: Expiry of the current agent certificate; unknown until the agent connects.
        certificateState:
          type: string
          enum: ["", ok, expiring, expired]
          description: >-
            expiring means the certificate is close to its expiry and was not renewed; agents renew
            it after two thirds of its lifetime. Empty when the expiry is unknown.
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        clusterId: { type: string }
        target: { type: string }
        result: { type: string }
        detail: {}

    Edition:
      type: string
      enum: [community, enterprise]
    EditionFeature:
      type: object
      required: [id, title, description, licensed]
      properties:
        id: { type: string, examples: [message-tools] }
        title: { type: string }
        description: { type: string }
        licensed:
          type: boolean
          description: The license covers the feature and is valid or in its grace period.
    LicenseInfo:
      type: object
      description: >-
        The license key in use. For a key that does not verify only `state`, `source` and
        `error` are set.
      required: [id, customer, email, features, state, source]
      properties:
        id: { type: string }
        customer: { type: string }
        email: { type: string }
        features:
          type: array
          description: Feature ids, or `*` for all features.
          items: { type: string }
        issuedAt: { type: string, format: date-time }
        notBefore: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        graceEndsAt: { type: string, format: date-time }
        state:
          type: string
          enum: [invalid, valid, grace, expired]
          description: >-
            valid from notBefore until expiresAt, grace until graceEndsAt, then expired; invalid
            when the key does not verify or is not valid yet. Enterprise features work in valid
            and grace.
        source:
          type: string
          enum: [environment, file, database]
          description: "`BROKERIUM_LICENSE`, `BROKERIUM_LICENSE_FILE` or the key stored through this API."
        error: { type: string, description: Why the key cannot be used. }
    LicenseView:
      type: object
      required: [edition, features, license]
      properties:
        edition: { $ref: "#/components/schemas/Edition" }
        features:
          type: array
          items: { $ref: "#/components/schemas/EditionFeature" }
        license:
          oneOf:
            - { $ref: "#/components/schemas/LicenseInfo" }
            - { type: "null" }
    LicenseRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The license key `brk-lic-1.<payload>.<signature>`; whitespace is ignored.

    ServerInfo:
      type: object
      required: [version, commit, date, edition, providers]
      properties:
        version: { type: string }
        commit: { type: string }
        date: { type: string }
        edition: { $ref: "#/components/schemas/Edition" }
        providers:
          type: object
          required: [docker]
          properties:
            docker: { $ref: "#/components/schemas/ProviderAvailability" }
    ProviderAvailability:
      type: object
      required: [available, reason]
      properties:
        available:
          type: boolean
          description: The server can create clusters of the provider and change their nodes.
        reason:
          type: string
          description: >-
            Why the provider is unavailable, for example which condition of the Docker installation
            failed; empty when it is available.
