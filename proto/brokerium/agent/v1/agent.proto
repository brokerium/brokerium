syntax = "proto3";

package brokerium.agent.v1;

option go_package = "github.com/brokerium/brokerium/proto/brokerium/agent/v1;agentv1";

// AgentService is served by brokerium-server; agents connect out to it (ADR 0009). Agents behind
// TLS-terminating proxies use the insecure transport (ADR 0017): the same calls on a listener of
// its own, with an enrollment proof instead of the join token and signed session messages.
service AgentService {
  // Enroll exchanges a single-use join token for the credentials of a node: a client
  // certificate for a CSR (mutual TLS) or a node secret for an enrollment proof (insecure
  // transport).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Connect is the long-lived command stream: the server sends commands, the agent answers
  // with results and periodic status reports.
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  // RenewCertificate signs a new client certificate for the node of the calling mTLS client
  // certificate. Agents call it after two thirds of the lifetime of their certificate.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

message RenewCertificateRequest {
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  bytes cert_der = 1;
  bytes ca_cert_der = 2;
}

message EnrollRequest {
  // Mutual TLS: the join token and a CSR.
  string token = 1;
  bytes csr_der = 2;
  string hostname = 3;
  string agent_version = 4;
  // Insecure transport: replaces token and csr_der.
  EnrollProof proof = 5;
}

// EnrollProof shows that the agent holds a join token without sending it. Its key is the hash
// the server stores for the token: the lowercase hex SHA-256 of the token secret, as text.
message EnrollProof {
  // SHA-256 of the key; it identifies the token.
  bytes token_lookup = 1;
  // X25519 public key of the agent for this enrollment; the node secret is encrypted to it.
  bytes public_key = 2;
  // 16 random bytes.
  bytes nonce = 3;
  // HMAC-SHA256 with the key over token_lookup, public_key, nonce, hostname and agent_version.
  bytes mac = 4;
}

message EnrollResponse {
  string node_id = 1;
  string node_name = 2;
  // Mutual TLS: the client certificate.
  bytes cert_der = 3;
  bytes ca_cert_der = 4;
  // Insecure transport: the node secret, encrypted to the public key of the proof.
  EncryptedSecret node_secret = 5;
  // Insecure transport: ECDSA P-256 signature (ASN.1) of the CA key over the MAC of the proof,
  // node_id, node_name, ca_cert_der and node_secret.
  bytes signature = 6;
}

// EncryptedSecret is the 32-byte node secret, encrypted with AES-256-GCM (the node id as
// additional data) under a key derived by HKDF-SHA256 from the X25519 shared secret.
message EncryptedSecret {
  // Ephemeral X25519 public key of the server.
  bytes public_key = 1;
  // AES-GCM nonce.
  bytes nonce = 2;
  bytes ciphertext = 3;
}

message AgentMessage {
  oneof body {
    Hello hello = 1;
    CommandResult result = 2;
    NodeStatus status = 3;
    // Insecure transport: the first message of a stream.
    SessionHello session_hello = 4;
    // Insecure transport: every later message. It carries an AgentMessage with hello, result
    // or status.
    SignedMessage signed = 5;
  }
}

// SessionHello opens a stream of the insecure transport.
message SessionHello {
  string node_id = 1;
  // 16 random bytes, new for every stream.
  bytes agent_nonce = 2;
  // Unix time in milliseconds; the server accepts five minutes of difference to its clock.
  int64 timestamp_ms = 3;
  // HMAC-SHA256 with the node secret over node_id, agent_nonce and timestamp_ms.
  bytes mac = 4;
}

// SessionAccept answers a session hello.
message SessionAccept {
  // 16 random bytes, new for every stream.
  bytes server_nonce = 1;
  // ECDSA P-256 signature (ASN.1) of the CA key over the node id, the agent nonce and
  // server_nonce.
  bytes signature = 2;
}

// SignedMessage carries one message of the insecure transport after the session handshake.
message SignedMessage {
  // 1 for the first message of each direction, one more for every further message.
  uint64 seq = 1;
  // Deterministic protobuf encoding of the AgentMessage or ServerMessage it carries.
  bytes signed_body = 2;
  // Server messages: ECDSA P-256 signature (ASN.1) of the CA key over the node id, both
  // nonces, seq and signed_body.
  bytes signature = 3;
  // Agent messages: HMAC-SHA256 with the node secret over the same fields.
  bytes mac = 4;
}

message Hello {
  string agent_version = 1;
  NodeStatus status = 2;
}

message ServerMessage {
  oneof body {
    Command command = 1;
    // Insecure transport: the answer to the session hello.
    SessionAccept session_accept = 2;
    // Insecure transport: every later message. It carries a ServerMessage with a command.
    SignedMessage signed = 3;
  }
}

// Command is one typed action. There is deliberately no generic shell command.
message Command {
  string id = 1;
  oneof action {
    InstallKafka install = 10;
    WriteConfig write_config = 11;
    FormatStorage format = 12;
    StartKafka start = 13;
    StopKafka stop = 14;
    GetStatus status = 15;
    WipeData wipe = 16;
  }
}

// InstallKafka makes a Kafka version available on the node, verifying the SHA-512 checksum
// published by the Apache Kafka project.
message InstallKafka {
  string version = 1;
  string mirror_url = 2;
}

// WriteConfig replaces server.properties and JVM settings of the node.
message WriteConfig {
  map<string, string> properties = 1;
  string heap_opts = 2;
}

enum FormatMode {
  FORMAT_MODE_UNSPECIFIED = 0;
  // --no-initial-controllers: brokers and controllers joining an existing cluster.
  FORMAT_MODE_JOIN = 1;
  // --initial-controllers: the initial voters of a new dynamic quorum.
  FORMAT_MODE_INITIAL = 2;
  // --standalone: a single initial voter.
  FORMAT_MODE_STANDALONE = 3;
}

// FormatStorage runs kafka-storage.sh format with --ignore-formatted.
message FormatStorage {
  string cluster_id = 1;
  FormatMode mode = 2;
  string initial_controllers = 3;
}

// StartKafka starts the Kafka process with the given installed version (or the active one).
message StartKafka {
  string version = 1;
}

// StopKafka stops Kafka gracefully (controlled shutdown), killing it after the timeout.
message StopKafka {
  int32 timeout_seconds = 1;
}

message GetStatus {}

// WipeData deletes the Kafka data directory. confirm must equal the node name.
message WipeData {
  string confirm = 1;
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string error = 3;
  NodeStatus status = 4;
  string output = 5;
}

message MetaProperties {
  string cluster_id = 1;
  int32 node_id = 2;
  string directory_id = 3;
  bool formatted = 4;
}

message NodeStatus {
  bool running = 1;
  string active_version = 2;
  repeated string installed_versions = 3;
  MetaProperties meta = 4;
  int64 data_bytes = 5;
  int64 disk_free_bytes = 6;
  string hostname = 7;
  int64 pid = 8;
  string last_exit = 9;
  string process_roles = 10;
  // Version of the Java runtime that runs Kafka, for example "21.0.8".
  string java_version = 11;
  // The node runs with an operator-owned configuration (agent --kafka-config).
  bool adopted = 12;
}
