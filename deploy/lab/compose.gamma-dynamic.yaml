#
# Scenario 10: cluster gamma after `kafka-features.sh upgrade --feature kraft.version=1`.
# Nodes switch from controller.quorum.voters to controller.quorum.bootstrap.servers and start
# through the lab start script, because the stock entrypoint cannot start a controller without
# controller.quorum.voters. Apply one node at a time:
#   docker compose -f compose.yaml -f compose.gamma-dynamic.yaml --profile gamma \
#     up -d --no-deps --wait gamma-c2
x-gamma-dynamic-env: &gamma-dynamic-env
  CLUSTER_ID: taBhtRlaSgiQS1-PVRVAxA
  QUORUM_BOOTSTRAP: gamma-c1:9093,gamma-c2:9093,gamma-c3:9093
  REPLICATION_FACTOR: "1"
  MIN_ISR: "1"
  FORMAT_MODE: join

services:
  gamma-c1:
    command: ["bash", "/lab/start.sh"]
    environment: { <<: *gamma-dynamic-env, ROLE: controller, NODE_ID: "1", NODE_HOST: gamma-c1 }
    volumes: ["./kafka:/lab:ro"]
  gamma-c2:
    command: ["bash", "/lab/start.sh"]
    environment: { <<: *gamma-dynamic-env, ROLE: controller, NODE_ID: "2", NODE_HOST: gamma-c2 }
    volumes: ["./kafka:/lab:ro"]
  gamma-c3:
    command: ["bash", "/lab/start.sh"]
    environment: { <<: *gamma-dynamic-env, ROLE: controller, NODE_ID: "3", NODE_HOST: gamma-c3 }
    volumes: ["./kafka:/lab:ro"]
  gamma-b1:
    command: ["bash", "/lab/start.sh"]
    environment: { <<: *gamma-dynamic-env, ROLE: broker, NODE_ID: "101", NODE_HOST: gamma-b1, EXTERNAL_PORT: "39101" }
    volumes: ["./kafka:/lab:ro"]
