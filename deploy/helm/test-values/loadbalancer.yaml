# Chart CI: render with a LoadBalancer service for both ports and an external-dns host name.
loadBalancer:
  enabled: true
  hostname: brokerium.example.com
  loadBalancerClass: example.com/lb
  sourceRanges: [10.0.0.0/8]
  externalTrafficPolicy: Local
