{{- if not .Values.existingSecret }}
{{- $name := include "brokerium.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $secretKey := .Values.secretKey | default (get $data "secret-key" | default "" | b64dec) | default (randBytes 32) }}
{{- $adminPassword := .Values.admin.password | default (get $data "admin-password" | default "" | b64dec) | default (randAlphaNum 20) }}
{{- $dbPassword := (get $data "postgres-password" | default "" | b64dec) | default (randAlphaNum 24) }}
{{- $dbURL := .Values.database.url }}
{{- if .Values.postgresql.enabled }}
{{- $dbURL = printf "postgres://brokerium:%s@%s-postgresql:5432/brokerium?sslmode=disable" $dbPassword $name }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "brokerium.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ $secretKey | b64enc }}
  admin-password: {{ $adminPassword | b64enc }}
  postgres-password: {{ $dbPassword | b64enc }}
  database-url: {{ required "database.url is required when postgresql.enabled is false" $dbURL | b64enc }}
{{- end }}
