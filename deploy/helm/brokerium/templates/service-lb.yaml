{{- with .Values.loadBalancer }}
{{- if .enabled }}
{{- if not .ports }}
{{- fail "loadBalancer.ports needs http, grpc, grpc-insecure or several of them" }}
{{- end }}
{{- if and (has "grpc-insecure" .ports) (not $.Values.agents.insecure.enabled) }}
{{- fail "loadBalancer.ports grpc-insecure needs agents.insecure.enabled" }}
{{- end }}
{{- $annotations := .annotations | default dict }}
{{- if .hostname }}
{{- $annotations = merge (dict "external-dns.alpha.kubernetes.io/hostname" .hostname) $annotations }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brokerium.fullname" $ }}-lb
  labels: {{- include "brokerium.labels" $ | nindent 4 }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .sourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector: {{- include "brokerium.selectorLabels" $ | nindent 4 }}
  ports:
    {{- if has "http" .ports }}
    - { name: http, port: {{ $.Values.service.http }}, targetPort: http }
    {{- end }}
    {{- if has "grpc" .ports }}
    - { name: grpc, port: {{ $.Values.service.grpc }}, targetPort: grpc }
    {{- end }}
    {{- if has "grpc-insecure" .ports }}
    - { name: grpc-insecure, port: {{ $.Values.agents.insecure.port }}, targetPort: grpc-insecure, appProtocol: kubernetes.io/h2c }
    {{- end }}
{{- end }}
{{- end }}
