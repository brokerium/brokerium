# community, or enterprise for Brokerium Enterprise, whose features need a license key (license).
edition: community

image:
  # Empty selects bvaliev/brokerium-server, or bvaliev/brokerium-server-enterprise for the
  # enterprise edition.
  repository: ""
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# One server runs the operations engine; several replicas are not supported yet.
replicaCount: 1

admin:
  username: admin
  # Password of the first administrator, used only when the database has no users yet.
  # Leave empty to generate one (kubectl get secret <release>-brokerium -o jsonpath='{.data.admin-password}').
  password: ""

# 32 random bytes, base64-encoded, sealing stored credentials. Generated on install and kept
# on upgrades. Losing it makes stored cluster credentials unreadable.
secretKey: ""
# Use an existing Secret with the keys secret-key, admin-password and database-url instead.
existingSecret: ""

# License key of Brokerium Enterprise, passed as BROKERIUM_LICENSE. It takes precedence over a key
# added on the License page of the dashboard, which is used when none is set here.
license:
  # Existing Secret with the key in the entry secretKey.
  existingSecret: ""
  secretKey: license
  # The key itself, stored in the chart's Secret; not available with existingSecret.
  key: ""

database:
  # postgres://user:password@host:5432/brokerium?sslmode=require; ignored when postgresql.enabled.
  url: ""

# A single PostgreSQL instance for evaluations. Use a managed database in production.
postgresql:
  enabled: true
  image: postgres:18-alpine
  storage: 5Gi
  storageClass: ""

# Public URL of the dashboard, used in links and in agent install commands. Empty means
# https://<gateway.http.hostname> with the Gateway, http://<loadBalancer.hostname>:<service.http>
# with a LoadBalancer host name, and http://localhost:8080 (port-forward) otherwise.
publicURL: ""

agents:
  # host:port agents dial for the agent gateway. Empty means <gateway.agents.hostname>:<port>
  # with the Gateway, <loadBalancer.hostname>:<service.grpc> with a LoadBalancer host name, and
  # the in-cluster service address otherwise.
  endpoint: ""
  # Extra names in the agent gateway certificate. The service names, the endpoint host,
  # gateway.agents.hostname and loadBalancer.hostname are added automatically.
  serverNames: []
  # HTTP CONNECT proxy the agents on hosts use; the install command passes it as HTTPS_PROXY
  # and NO_PROXY, for example https: http://proxy.example.com:3128.
  proxy:
    https: ""
    noProxy: ""
  # Plaintext gRPC listener (service port grpc-insecure) for agents behind a reverse proxy that
  # terminates TLS, such as OpenResty or nginx with grpc_pass. Agents and server authenticate
  # every message instead of the connection. When enabled, the install command on the Nodes
  # page uses this transport; agents installed for mutual TLS keep working.
  insecure:
    enabled: false
    port: 8444
    # host:port agents dial: the proxy, for example agents.example.com:443. Required when enabled.
    endpoint: ""
    # TLS between agents and the proxy: system (verified against the system CAs of the host),
    # skip-verify or none (plaintext).
    tls: system

# ClusterIP service with both ports, always created.
service:
  http: 8080
  grpc: 8443
  annotations: {}

# An additional service of type LoadBalancer, for example for agents on virtual machines. One
# service carries both ports. Port http is plain HTTP: expose it only on internal networks, with
# the TLS annotations of your provider, or serve the dashboard through the Gateway instead.
loadBalancer:
  enabled: false
  # http: dashboard and API; grpc: agent gateway (mutual TLS); grpc-insecure: the plaintext agent
  # listener of agents.insecure, for a proxy outside the Kubernetes cluster.
  ports: [http, grpc]
  # DNS name for external-dns (annotation external-dns.alpha.kubernetes.io/hostname).
  hostname: ""
  annotations: {}
  loadBalancerClass: ""
  sourceRanges: []
  # Cluster or Local; empty keeps the Kubernetes default.
  externalTrafficPolicy: ""

# Gateway API routes (gateway.networking.k8s.io/v1): Gateway API 1.5 or later, Kubernetes 1.31 or
# later.
gateway:
  # Create a Gateway for the routes. Otherwise the routes attach to parentRefs.
  create: false
  className: ""
  annotations: {}
  # Existing Gateway listeners for the routes when create is false, for example
  # [{name: shared, namespace: gateways}].
  parentRefs: []
  # HTTPRoute for the dashboard and API; TLS terminates at the gateway.
  http:
    enabled: false
    hostname: brokerium.example.com
    # Certificate Secret of the HTTPS listener of a created Gateway; empty means <fullname>-tls,
    # for example issued by cert-manager through gateway.annotations.
    tlsSecretName: ""
    # A created Gateway also listens on port 80 and redirects to HTTPS.
    redirect: true
  # TLSRoute for the agent gateway. TLS passes through to the server, which authenticates
  # agents with mutual TLS.
  agents:
    enabled: false
    hostname: agents.brokerium.example.com
    port: 8443

# Lets Brokerium manage Strimzi clusters in this Kubernetes cluster with its service account
# (cluster setting "in-cluster access").
rbac:
  strimzi: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

# Secure session cookies; always on when the public URL uses HTTPS.
secureCookies: false
snapshotInterval: 15s
# Debug logging of every API request.
debug: false

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
